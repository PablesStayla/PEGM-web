# ==============================================================================
# 📝 PRANAKAIA E-COMMERCE - CHANGELOG ENGINE (GIT-CLIFF)
# ==============================================================================
# Role: Automated Changelog Generation & Version Governance
# Tier: Absolute Zero (S+)
# Compliance: Enterprise Semantic Versioning
# Last Updated: 2026-05-05
# ==============================================================================

[changelog]
header = """
# Changelog
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

---
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
        {{ commit.message | upper_first }}\
        {% if commit.links %} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.links[0].href }})){% endif %}\
    {% endfor %}
{% endfor %}
"""
trim = true
footer = """
---
© 2026 PranaKaia E-Commerce Platform. All rights reserved.
"""

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "🚀 Added" },
  { message = "^fix", group = "🐛 Fixed" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🔄 Changed" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^docs", group = "📝 Documentation" },
  { message = "^chore", group = "🔧 Maintenance" },
  { message = "^ci", group = "👷 CI/CD" },
  { message = "^revert", group = "⏪ Reverted" },
  { message = "^style", skip = true },
  { body = ".*security", group = "🔒 Security" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
ignore_tags = ""
sort_commits = "newest"
