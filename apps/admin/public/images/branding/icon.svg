<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Circle background -->
  <circle cx="60" cy="60" r="58" fill="#1a4d2e"/>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="#c5a059" stroke-width="1.5"/>
  
  <!-- Minimalist seed/bud with radiating lines -->
  <g transform="translate(60,50)">
    <!-- Radiating lines (sun rays) -->
    <g stroke="#5cb874" stroke-width="0.8" opacity="0.5">
      <line x1="0" y1="-18" x2="0" y2="-26"/>
      <line x1="8" y1="-16" x2="13" y2="-23"/>
      <line x1="-8" y1="-16" x2="-13" y2="-23"/>
      <line x1="14" y1="-10" x2="22" y2="-14"/>
      <line x1="-14" y1="-10" x2="-22" y2="-14"/>
      <line x1="16" y1="-2" x2="24" y2="-3"/>
      <line x1="-16" y1="-2" x2="-24" y2="-3"/>
    </g>
    
    <!-- Seed/bud shape -->
    <path d="M0,-20 C10,-16 14,-6 10,4 C8,8 4,12 0,14 C-4,12 -8,8 -10,4 C-14,-6 -10,-16 0,-20Z" fill="#5cb874"/>
    <path d="M0,-20 C0,-12 0,-2 0,14" stroke="#1a4d2e" stroke-width="1.2" fill="none"/>
    <path d="M0,-10 C4,-8 7,-4 8,0" stroke="#1a4d2e" stroke-width="0.8" fill="none"/>
    <path d="M0,-10 C-4,-8 -7,-4 -8,0" stroke="#1a4d2e" stroke-width="0.8" fill="none"/>
    
    <!-- Stem -->
    <line x1="0" y1="14" x2="0" y2="26" stroke="#5cb874" stroke-width="1.8"/>
    
    <!-- Roots -->
    <g stroke="#5cb874" stroke-width="1.2" fill="none">
      <path d="M0,26 C-4,32 -10,38 -16,42"/>
      <path d="M0,26 C4,32 10,38 16,42"/>
      <path d="M0,26 C-2,34 -6,42 -10,48"/>
      <path d="M0,26 C2,34 6,42 10,48"/>
      <path d="M0,26 C0,36 -1,44 -2,50"/>
    </g>
  </g>
  
  <!-- PRANA KAIA text curved on top -->
  <defs>
    <path id="topArc" d="M18,60 A42,42 0 0,1 102,60"/>
    <path id="bottomArc" d="M25,68 A40,40 0 0,0 95,68"/>
  </defs>
  <text font-family="'Georgia', 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="4" fill="#f5f0e8">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">PRANA KAIA</textPath>
  </text>
  <text font-family="'Georgia', 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="6" fill="#f5f0e8">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">GROW</textPath>
  </text>
</svg>
