name: '🛠️ Tarea de Ingeniería'
description: 'Actividades técnicas generales, mantenimiento o tareas operativas.'
title: '[Task]: '
labels: ['task', 'chore']
body:
  - type: markdown
    attributes:
      value: |
        ### ⚙️ Operaciones Absolute Zero
        Usa este template para tareas de mantenimiento, CI/CD o actualizaciones de dependencias.

  - type: textarea
    id: summary
    attributes:
      label: '📝 Resumen de la Tarea'
      description: 'Define claramente el entregable técnico.'
      placeholder: 'Ej: Actualizar Node.js a la versión 24 en todos los workflows.'
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: '📋 Detalles Técnicos'
      description: 'Consideraciones especiales, dependencias o riesgos.'
      placeholder: 'Ej: Requiere validar compatibilidad con Sharp en apps/web.'
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: '⚡ Prioridad'
      options:
        - 'Inmediata'
        - 'Alta'
        - 'Normal'
        - 'Baja'
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: '✅ Checklist de Definición de Terminado (DoD)'
      description: '¿Cómo sabemos que la tarea está lista?'
      placeholder: |
        - [ ] Task ejecutada con éxito.
        - [ ] CI/CD Green.
        - [ ] Documentación actualizada si aplica.
    validations:
      required: true
