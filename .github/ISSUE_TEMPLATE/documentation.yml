name: '📚 Mejora de Documentación'
description: 'Propone o corrige contenido en manuales, ADRs o guías técnicas.'
title: '[Docs]: '
labels: ['documentation']
body:
  - type: markdown
    attributes:
      value: |
        ### 📖 Conocimiento Compartido
        Un sistema sin documentación es un sistema que no escala. Ayúdanos a mantener la "Single Source of Truth".

  - type: textarea
    id: context
    attributes:
      label: '📝 Contexto / Ubicación'
      description: '¿Qué documento o sección necesita atención?'
      placeholder: 'Ej: Guía de integración de Stripe en /docs/payments.md'
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: '💡 Mejora Propuesta'
      description: '¿Qué falta o qué está incorrecto?'
      placeholder: 'Ej: Falta explicar el manejo de webhooks para reembolsos parciales.'
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: '🏷️ Tipo de Documento'
      options:
        - 'ADR (Architectural Decision Record)'
        - 'Guía de Usuario / Admin'
        - 'Documentación Técnica (API/SDK)'
        - 'ReadMe / Setup'
        - 'Diagrama / Arquitectura'
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: '✅ Calidad'
      options:
        - label: 'La información es precisa y está actualizada.'
          required: true
        - label: 'Sigue el tono de voz profesional del proyecto.'
          required: true
