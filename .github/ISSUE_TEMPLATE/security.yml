name: '🛡️ Vulnerabilidad de Seguridad'
description: 'Reporta un problema de seguridad que deba ser mitigado.'
title: '[Security]: '
labels: ['security', 'priority-critical']
body:
  - type: markdown
    attributes:
      value: |
        ### 🔐 Seguridad Primero
        **IMPORTANTE:** Si esta vulnerabilidad es crítica y puede ser explotada en producción, considera contactar directamente a @PablesStayla de forma privada. 

  - type: textarea
    id: description
    attributes:
      label: '📝 Descripción de la Vulnerabilidad'
      description: 'Explica el riesgo de seguridad detectado.'
      placeholder: 'Ej: IDOR detectado en el endpoint de perfiles de usuario.'
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: '🚨 Gravedad (CVSS Estimado)'
      options:
        - 'Crítica (9.0 - 10.0)'
        - 'Alta (7.0 - 8.9)'
        - 'Media (4.0 - 6.9)'
        - 'Baja (0.1 - 3.9)'
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: '💥 Impacto Potencial'
      description: '¿Qué datos o procesos están en riesgo?'
      placeholder: 'Ej: Acceso no autorizado a datos personales (PII) de otros clientes.'
    validations:
      required: true

  - type: textarea
    id: poc
    attributes:
      label: '🧪 Prueba de Concepto (PoC)'
      description: 'Pasos para demostrar la vulnerabilidad (Uso responsable).'
      render: shell
    validations:
      required: true

  - type: textarea
    id: mitigation
    attributes:
      label: '🛡️ Mitigación Sugerida'
      description: '¿Cómo podemos cerrar esta brecha?'
      placeholder: 'Ej: Implementar validación de propiedad en el middleware de autorización.'
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: '✅ Compromiso'
      options:
        - label: 'He verificado que esta información no contiene credenciales reales.'
          required: true
        - label: 'Me comprometo a no divulgar esta vulnerabilidad hasta que sea mitigada.'
          required: true
