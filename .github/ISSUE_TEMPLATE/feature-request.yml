name: '✨ Propuesta de Funcionalidad'
description: 'Propone una mejora funcional con valor de negocio y diseño claro.'
title: '[Feature]: '
labels: ['enhancement', 'triage-needed']
body:
  - type: markdown
    attributes:
      value: |
        ### 🚀 Innovación Absolute Zero
        Gracias por proponer una mejora. Para que una funcionalidad sea aceptada, debe estar alineada con nuestra arquitectura de alto rendimiento y ofrecer un valor medible.

  - type: textarea
    id: problem
    attributes:
      label: '📝 Problema o Fricción'
      description: '¿Qué problema resolvemos con esto? Evita hablar de la solución aquí.'
      placeholder: 'Ej: Los usuarios abandonan el carrito porque no pueden ver el tiempo de entrega estimado.'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: '💡 Propuesta de Solución'
      description: 'Describe cómo imaginas la solución técnica y funcional.'
      placeholder: 'Ej: Integrar la API de logística para mostrar dinámicamente la fecha de entrega en el resumen del carrito.'
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: '💰 Valor de Negocio / Impacto'
      description: '¿Cómo mediremos el éxito? (Conversión, Performance, UX)'
      placeholder: 'Ej: Esperamos reducir el abandono de carrito en un 5%.'
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: '🎨 Consideraciones de Diseño / UX'
      description: '¿Requiere cambios en el Platinum Design System? ¿Hay mocks o referencias?'
      placeholder: 'Usar componentes de Skeleton y Motion de Framer para la transición.'
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: '✅ Criterios de Aceptación'
      description: 'Lista de condiciones verificables (S+ Grade).'
      placeholder: |
        - [ ] El tiempo de entrega se actualiza al cambiar el código postal.
        - [ ] Se incluye loading state "Platinum Style".
        - [ ] Unit Test Coverage al 100%.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: '✅ Alineación'
      options:
        - label: 'He verificado que esta propuesta no rompe principios de DDD.'
          required: true
        - label: 'He buscado propuestas similares para evitar duplicidad.'
          required: true
