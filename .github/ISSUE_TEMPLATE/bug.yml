name: '🐛 Reporte de Bug'
description: 'Reporta un problema reproducible con evidencia técnica.'
title: '[Bug]: '
labels: ['bug', 'triage-needed']
body:
  - type: markdown
    attributes:
      value: |
        ### 🏆 Compromiso de Calidad
        Gracias por ayudarnos a mantener el estándar **Absolute Zero**. Un buen reporte de bug nos permite actuar con velocidad quirúrgica.
  
  - type: textarea
    id: summary
    attributes:
      label: '📝 Resumen del Problema'
      description: 'Describe el error de forma concisa pero completa.'
      placeholder: 'Ej: El cálculo del carrito falla cuando se aplican dos cupones de descuento.'
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: '🚨 Gravedad'
      description: '¿Qué tan crítico es este problema?'
      options:
        - 'S1 - Crítico (Blocker / Data Loss)'
        - 'S2 - Alto (Funcionalidad principal rota)'
        - 'S3 - Medio (Funcionalidad parcial / UX)'
        - 'S4 - Bajo (Cosmético / Mejora)'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: '🔢 Pasos para Reproducir'
      description: 'Danos la receta exacta para ver el error.'
      placeholder: |
        1. Iniciar sesión como usuario X
        2. Agregar producto Y al carrito
        3. Ir al checkout y...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: '🎯 Comportamiento Esperado'
      description: '¿Qué debería haber pasado según el diseño?'
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: '❌ Comportamiento Actual'
      description: '¿Qué pasó realmente? (Incluye mensajes de error si existen)'
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: '📊 Evidencia Técnica'
      description: 'Logs, stack traces, screenshots o IDs de transacciones.'
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: '🏷️ Versión / Commit SHA'
      description: '¿En qué versión o commit detectaste esto?'
      placeholder: 'v1.2.3 o 7f3a2b1'
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: '✅ Validaciones Previas'
      options:
        - label: 'He buscado en otros issues y no hay duplicados.'
          required: true
        - label: 'El problema persiste en la última versión estable.'
          required: true
