# 📘 Reusable Typecheck Workflow - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Validar tipos de TypeScript de forma estricta
# Owner: @engineering-team
# ─────────────────────────────────────────────────

name: 📘 Type Check

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '24'
      pnpm-version:
        description: 'PNPM version'
        type: string
        default: '9'

permissions:
  contents: read

jobs:
  typecheck:
    name: '📘 TypeScript Check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: 📁 Setup Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: 🟦 Strict Type Check
        run: |
          echo "::group::TypeScript Results"
          pnpm turbo type-check -- --strict
          echo "::endgroup::"
