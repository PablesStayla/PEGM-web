# 📊 Performance Pipeline - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Monitorear bundle size, Lighthouse y carga
# Owner: @engineering-team
# ─────────────────────────────────────────────────

name: 📊 Performance Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
  schedule:
    - cron: '0 0 * * 1' # Weekly Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-analysis:
    name: '📦 Bundle Analysis'
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Setup
        uses: ./.github/workflows/reusable-setup.yml

      - name: 🏗️ Build & Analyze
        run: |
          pnpm turbo build --filter=@pranakaia/web -- --analyze
        env:
          ANALYZE: true

      - name: 📦 Upload Stats
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: apps/web/.next/analyze/

  lighthouse:
    name: '🔦 Lighthouse'
    runs-on: ubuntu-latest
    needs: [bundle-analysis]
    steps:
      - name: ⚙️ Setup
        uses: ./.github/workflows/reusable-setup.yml

      - name: 🏗️ Build Web
        run: pnpm turbo build --filter=@pranakaia/web

      - name: 🔦 Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: 'tests/performance/lighthouse/lighthouse.config.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  load-test:
    name: '⚡ Load Testing'
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: ⚡ Run k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/k6/checkout-load.js
        env:
          BASE_URL: ${{ secrets.PRODUCTION_URL }}
