# 📚 Documentation Pipeline - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Construir y desplegar documentación técnica
# Triggers: Push a main/develop en carpeta docs/ o contratos
# Owner: @engineering-team
# ─────────────────────────────────────────────────

name: 📚 Documentation

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'contracts/**'
      - '*.md'
  pull_request:
    paths:
      - 'docs/**'
      - 'contracts/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: '📚 Build & Deploy Docs'
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Setup
        uses: ./.github/workflows/reusable-setup.yml

      - name: 📝 Markdown Lint
        run: pnpm dlx markdownlint-cli "**/*.md" --ignore node_modules --ignore docs/build

      - name: 🏗️ Build Docusaurus
        run: |
          cd docs
          pnpm install
          pnpm run build

      - name: 🚀 Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
          cname: docs.pranakaia.com
