# 🛠️ Maintenance - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Limpieza de issues, PRs y auditoría de dependencias
# Owner: @engineering-team
# ─────────────────────────────────────────────────

name: 🛠️ Maintenance

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  stale:
    name: '🧹 Stale Management'
    runs-on: ubuntu-latest
    steps:
      - name: Handle Stale Issues & PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'Este issue lleva 30 días sin actividad y será cerrado en 7 días si no hay respuesta.'
          stale-pr-message: 'Este PR lleva 14 días sin actividad y será cerrado en 7 días si no hay respuesta.'
          close-issue-message: 'Cerrando por inactividad. Si el problema persiste, abre un nuevo issue.'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,critical'
          exempt-pr-labels: 'pinned,security'

  audit:
    name: '🛡️ Dependency Audit'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup
        with:
          install: true

      - name: 🔍 Security Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
