# 🧪 Reusable Test Workflow - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Ejecutar tests unitarios e integración con base de datos
# Owner: @engineering-team
# ─────────────────────────────────────────────────

name: 🧪 Tests

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '24'
      pnpm-version:
        description: 'PNPM version'
        type: string
        default: '9'

permissions:
  contents: read

jobs:
  test:
    name: '🧪 Unit & Integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: 🧪 Run Tests with Coverage
        run: |
          echo "::group::Test Results"
          pnpm turbo test:unit -- --reporter=verbose --coverage
          echo "::endgroup::"
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 30

      - name: 🧬 Mutation Testing (Stryker)
        if: github.event_name == 'pull_request'
        run: |
          echo "::group::Stryker Results"
          pnpm test:mutation:critical
          echo "::endgroup::"
