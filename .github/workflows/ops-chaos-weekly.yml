# 🌪️ Chaos Weekly - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Validar la resiliencia del sistema bajo condiciones de caos
# Owner: @engineering-team
# ─────────────────────────────────────────────────

name: 🌪️ Chaos Weekly

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos:
    name: 'Weekly Chaos Resilience'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup
        with:
          install: true

      - name: 🌪️ Run Chaos Profile
        env:
          TARGET_URL: ${{ secrets.CHAOS_TARGET_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "::error::CHAOS_TARGET_URL secret is required"
            exit 1
          fi
          pnpm load:spike

      - name: 📦 Upload Chaos Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-weekly-report-${{ github.run_id }}
          path: |
            reports/
            test-results/
          if-no-files-found: ignore

      - name: 📊 Publish Summary
        if: always()
        run: |
          echo "### 🌪️ Chaos Weekly Resilience Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Profile:** tests/load/k6/spike-test.js" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")" >> "$GITHUB_STEP_SUMMARY"
