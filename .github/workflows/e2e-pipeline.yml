# 🎭 E2E Pipeline - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Orquestar tests de integración total y UI
# Triggers: Push a main, Scheduled nightly, Manual
# Owner: @qa-team
# ─────────────────────────────────────────────────

name: 🎭 E2E Quality Gates

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # Nightly at 2 AM
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-web:
    name: '🎭 E2E Web'
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      workspace: 'web'

  e2e-admin:
    name: '🎭 E2E Admin'
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      workspace: 'admin'
