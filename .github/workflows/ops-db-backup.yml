# 🗄️ Database Backup - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Respaldar la base de datos de Supabase diariamente
# Owner: @engineering-team
# ─────────────────────────────────────────────────

name: 🗄️ Database Backup

on:
  schedule:
    # Daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read

jobs:
  backup:
    name: 'Backup Database (${{ github.event.inputs.environment || "production" }})'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 20
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup
        with:
          install: true

      - name: 🛠️ Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: 🚀 Run Backup Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📦 Starting database backup..."
          pnpm db:backup ${{ github.event.inputs.environment || 'production' }} "Automatic Scheduled Backup" --compress

      - name: 📦 Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.event.inputs.environment || 'production' }}-${{ github.run_id }}
          path: backups/
          retention-days: 30

      - name: 🔔 Failure Notification
        if: failure()
        run: |
          echo "::error::Database backup FAILED for ${{ github.event.inputs.environment || 'production' }}"
          echo "Backup failed at $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
