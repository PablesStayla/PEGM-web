name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Type check (TypeScript 7)
        run: npm run type-check

      - name: Build (Next.js 16 + Turbopack)
        run: npm run build
        env:
          AUTH_SECRET: ci-secret-only-for-build
