name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Docs check (docs-sync)
        run: pnpm docs:check

      - name: Tests (Vitest)
        run: pnpm test

      - name: Type check (TypeScript 7)
        run: pnpm run type-check

      - name: Build (Next.js 16 + Turbopack)
        run: pnpm run build
        env:
          AUTH_SECRET: ci-secret-only-for-build
          NEXT_PUBLIC_SITE_URL: https://pablo-ejemplo.vercel.app

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        run: pnpm run test:e2e
        env:
          AUTH_SECRET: ci-secret-only-for-e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Consistencia multiagente
        run: pnpm run check:agents

      - name: Scripts (sintaxis e importación)
        run: pnpm run check:scripts

      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level=high
