name: Packages Validation

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  validate-packages:
    name: Validate Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo build --filter='@pranakaia/*'

      - name: Type check
        run: pnpm turbo type-check --filter='@pranakaia/*'

      - name: Run tests
        run: pnpm turbo test --filter='@pranakaia/*'

      - name: Check package exports with attw
        run: pnpm packages:attw

      - name: Validate package structure with publint
        run: pnpm packages:publint

      - name: Check bundle sizes
        run: pnpm size-limit
        continue-on-error: true

      - name: Upload size-limit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-limit-report
          path: size-limit-report.json
          retention-days: 7

  changeset-check:
    name: Check Changesets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changesets on changed packages
        run: pnpm version:check
        continue-on-error: true

  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: [validate-packages, changeset-check]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo build --filter='@pranakaia/*'

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
