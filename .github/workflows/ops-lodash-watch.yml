name: Lodash Upstream Watch

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: lodash-upstream-watch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PNPM_VERSION: '9'
  NODE_VERSION: '24'

jobs:
  watch-lodash:
    name: Check lodash patched release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup
        with:
          install: true

      - name: Detect upstream patch availability
        id: check
        shell: bash
        run: |
          OUTPUT=$(pnpm -w security:lodash:watch 2>&1)

          echo "$OUTPUT"

          LATEST=$(echo "$OUTPUT" | grep -E "Latest lodash version published:" | awk '{print $5}')
          PATCH_AVAILABLE=$(echo "$OUTPUT" | grep -E "^PATCH_AVAILABLE=" | tail -1 | cut -d'=' -f2)

          if [ -z "$PATCH_AVAILABLE" ]; then
            PATCH_AVAILABLE=false
          fi

          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "patch_available=${PATCH_AVAILABLE}" >> "$GITHUB_OUTPUT"

      - name: No patch yet summary
        if: steps.check.outputs.patch_available != 'true'
        run: |
          echo "## Lodash Watch" >> "$GITHUB_STEP_SUMMARY"
          echo "No patched upstream release available yet." >> "$GITHUB_STEP_SUMMARY"
          echo "Latest detected: ${{ steps.check.outputs.latest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply upstream patch migration
        if: steps.check.outputs.patch_available == 'true'
        run: |
          pnpm -w security:lodash:apply
          pnpm install --lockfile-only

      - name: Validate security triage after migration
        if: steps.check.outputs.patch_available == 'true'
        run: pnpm -w security:audit

      - name: Create automated PR
        if: steps.check.outputs.patch_available == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(security): remove temporary lodash exceptions'
          title: 'chore(security): remove temporary lodash exceptions'
          body: |
            Automated weekly security maintenance.

            - Detected patched upstream lodash release: ${{ steps.check.outputs.latest }}
            - Updated dependency override to patched version
            - Removed temporary lodash allowlist entries from triage
            - Updated security exceptions document
          branch: chore/security-lodash-upstream-patch
          delete-branch: true
          labels: |
            security
            dependencies
            automation
          add-paths: |
            package.json
            pnpm-lock.yaml
            scripts/security/audit-triage.ts
            docs/operations/SECURITY_EXCEPTIONS.md
