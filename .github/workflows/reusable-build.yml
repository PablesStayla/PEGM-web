# 🏗️ Reusable Build Workflow - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Compilar las aplicaciones del monorepo
# Owner: @engineering-team
# ─────────────────────────────────────────────────

name: 🏗️ Build

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '24'
      pnpm-version:
        description: 'PNPM version'
        type: string
        default: '9'

permissions:
  contents: read

jobs:
  build:
    name: '🏗️ Build ${{ matrix.workspace }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        workspace: ['web', 'admin', 'api']
    steps:
      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: 📁 Setup Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: 🏗️ Build Application
        run: |
          echo "::group::Building ${{ matrix.workspace }}"
          pnpm turbo build --filter=${{ matrix.workspace }}
          echo "::endgroup::"

      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.workspace }}-${{ github.run_id }}
          path: apps/${{ matrix.workspace }}/.next
          retention-days: 1
