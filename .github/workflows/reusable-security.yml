# 🛡️ Reusable Security Workflow - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Análisis de seguridad estático y auditoría de dependencias
# Owner: @security-team
# ─────────────────────────────────────────────────

name: 🛡️ Security Scan

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '24'
      pnpm-version:
        description: 'PNPM version'
        type: string
        default: '9'

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: '🛡️ SAST & Dependency Audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: 🕵️ SAST Scanner (Custom)
        run: |
          echo "::group::Security Scan Results"
          pnpm security:scan
          echo "::endgroup::"

      - name: 📦 Dependency Audit
        run: |
          echo "::group::Audit Results"
          pnpm audit --audit-level=high || true
          echo "::endgroup::"

      - name: 🔑 Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
