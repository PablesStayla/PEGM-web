# 🚀 Main CI Pipeline - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Orquestar todas las validaciones de calidad
# Triggers: Push a main/develop, Pull Requests
# Owner: @engineering-team
# Status: Production Grade (S+ Superior)
# ─────────────────────────────────────────────────

name: 🚀 Production Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Validaciones estáticas y auditoría de calidad
  audit:
    name: '🔍 Quality'
    uses: ./.github/workflows/reusable-lint.yml

  # 2. Validación de tipos (en paralelo con lint)
  types:
    name: '📘 Types'
    uses: ./.github/workflows/reusable-typecheck.yml

  # 3. Tests (depende de que el setup básico sea posible, pero lo manejamos dentro)
  tests:
    name: '🧪 Tests'
    needs: [audit, types]
    uses: ./.github/workflows/reusable-test.yml

  # 4. Compilación (depende de tipos)
  build:
    name: '🏗️ Build'
    needs: [types]
    uses: ./.github/workflows/reusable-build.yml

  # 5. Seguridad (en paralelo)
  security:
    name: '🛡️ Security'
    uses: ./.github/workflows/reusable-security.yml

  # ✅ GATE FINAL - Consolidación de resultados
  quality-gate:
    name: '✅ Final Quality Gate'
    runs-on: ubuntu-latest
    needs: [audit, types, tests, build, security]
    if: always()
    steps:
      - name: 🏆 Consolidate Status
        run: |
          echo "::group::Pipeline Status Summary"
          FAILED=0
          
          # Verificar estados
          check_job() {
            if [ "$1" != "success" ]; then
              echo "❌ $2 failed"
              FAILED=$((FAILED + 1))
            else
              echo "✅ $2 passed"
            fi
          }
          
          check_job "${{ needs.audit.result }}" "Quality Audit"
          check_job "${{ needs.types.result }}" "Type Check"
          check_job "${{ needs.tests.result }}" "Unit Tests"
          check_job "${{ needs.build.result }}" "App Build"
          check_job "${{ needs.security.result }}" "Security Scan"
          
          echo "::endgroup::"
          
          if [ $FAILED -eq 0 ]; then
            echo "::notice::🎉 WORLD CLASS STANDARDS MET. Proceeding..."
            exit 0
          else
            echo "::error::Quality gates not met ($FAILED failures). Blocking pipeline."
            exit 1
          fi
