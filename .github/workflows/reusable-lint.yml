# 🔍 Reusable Lint Workflow - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Ejecutar validaciones estáticas y auditorías de calidad
# Owner: @engineering-team
# ─────────────────────────────────────────────────

name: 🔍 Quality Audit

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '24'
      pnpm-version:
        description: 'PNPM version'
        type: string
        default: '9'

permissions:
  contents: read

jobs:
  lint:
    name: '🔍 Lint & Quality Audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⚙️ Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: ✨ Biome Lint & Format
        run: |
          echo "::group::Biome Results"
          pnpm biome check .
          echo "::endgroup::"

      - name: 💀 Dead Code Analysis (Knip)
        run: |
          echo "::group::Knip Results"
          pnpm knip
          echo "::endgroup::"

      - name: 🏆 World-Class Audit
        run: |
          echo "::group::Elite Quality Audit"
          pnpm world-class:audit
          echo "::endgroup::"
