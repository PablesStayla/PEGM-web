# 🔄 Notion Sync (Issues) - Absolute Zero
# ─────────────────────────────────────────────────
# Propósito: Sincronizar issues de GitHub con la base de datos de Notion
# Owner: @engineering-team
# ─────────────────────────────────────────────────

name: 🔄 Notion Sync (Issues)

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to sync'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: 'Sync Issue to Notion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup
        with:
          install: true

      - name: 🔄 Run Sync Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_TAREAS: ${{ secrets.NOTION_DB_TAREAS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
          else
            ISSUE_NUM="${{ github.event.issue.number }}"
          fi
          echo "🔄 Syncing issue #$ISSUE_NUM to Notion..."
          pnpm exec tsx scripts/notion/sync-issue.ts "$ISSUE_NUM"
