name: Bundle Size Check

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packages/**'
      - '.size-limit.json'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '.size-limit.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  bundle-size:
    name: Check Bundle Sizes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo build --filter='@pranakaia/*'

      - name: Check bundle sizes
        run: pnpm size-limit
        continue-on-error: true

      - name: Save size-limit JSON
        run: pnpm size-limit --json > size-limit-report.json
        continue-on-error: true

      - name: Upload size-limit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-limit-report
          path: size-limit-report.json
          retention-days: 7

      - name: Comment PR with bundle sizes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('size-limit-report.json', 'utf-8'));
            
            let comment = '## 📦 Bundle Size Report\n\n';
            comment += '| Package | Size | Limit | Status |\n';
            comment += '|---------|------|-------|--------|\n';
            
            report.forEach(item => {
              const status = item.sizeOK ? '✅' : '❌';
              comment += `| ${item.name} | ${item.size} | ${item.limit} | ${status} |\n`;
            });
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
