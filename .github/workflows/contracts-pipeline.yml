# 📜 Contracts Pipeline - OpenAPI Enterprise
# ─────────────────────────────────────────────────────
# Propósito: Validar contratos OpenAPI y generar documentación
# Owner: @platform-team
# ─────────────────────────────────────────────────────

name: 📜 API Contracts

on:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/openapi/**'
      - 'docs/architecture/API.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'contracts/openapi/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: '📜 OpenAPI Validation'
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Setup
        uses: ./.github/workflows/reusable-setup.yml
        with:
          install: true # Needed for redocly if we use it via pnpm

      - name: 🔍 Discover & Lint
        run: |
          mkdir -p .artifacts/contracts
          # Validar cada archivo OpenAPI encontrado
          find contracts/openapi -type f \( -name '*.yaml' -o -name '*.yml' \) | while read spec; do
            echo "::group::Validating $spec"
            pnpm dlx @redocly/cli lint "$spec"
            pnpm dlx @redocly/cli bundle "$spec" --output ".artifacts/contracts/$(basename "$spec")"
            echo "::endgroup::"
          done

      - name: 📦 Upload Bundles
        uses: actions/upload-artifact@v4
        with:
          name: api-contracts-${{ github.run_id }}
          path: .artifacts/contracts/
