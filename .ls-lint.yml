ls:
  .dir: kebab-case | lowercase
  .ts: kebab-case | camelCase
  .tsx: PascalCase | kebab-case
  .js: kebab-case
  .mjs: kebab-case
  .json: kebab-case
  .md: kebab-case | lowercase | regex:^[A-Z0-9_-]+$
  .yml: kebab-case | lowercase
  .yaml: kebab-case | lowercase

ignore:
  - .git
  - node_modules
  - dist
  - .next
  - .turbo
  - .agents
  - .changeset
  - .vscode
  - .vercel
  - data
  - arbol.txt
  - pnpm-lock.yaml
  - package.json.backup
  - hermes-task-tsdoc.txt
  - test_output.txt
  - LICENSE
  - "**/node_modules"
  - "**/dist"
  - "**/.next"
  - "**/.turbo"
  - .github

